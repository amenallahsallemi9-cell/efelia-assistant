[project]
name = "efelia-assistant"
version = "0.1.0"
description = "Agent d'instruction des dossiers de la Bourse Excellence EFELIA Côte d'Azur 2026"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5.0",
    "rq>=1.16",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "pillow>=10.4",
    "cohere>=5.11",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "reportlab>=4.2",  # génération des PDF de démonstration (make seed) et des fixtures
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "S", "C4", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # caractères accentués / typographiques volontaires (textes en français)
    "N818",  # noms d'exceptions en français (ErreurApi…)
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.domain.*"
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing:skip-covered"
markers = [
    "integration: nécessite PostgreSQL et Redis",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
skip_covered = true
show_missing = true

# PyMuPDF n'est pas typé : on le traite comme dynamique plutôt que de multiplier les ignores.
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"
follow_untyped_imports = false
