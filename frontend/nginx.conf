# Journal d'accès SANS chaîne de requête : `?surligner=` contient un extrait de document.
log_format sans_parametres '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent ${request_time}s';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log sans_parametres;
  server_tokens off;

  # DNS de Docker, réinterrogé toutes les 10 s : si le conteneur `api` est recréé (nouvelle
  # IP), nginx le retrouve. Sans cela, il garde l'ancienne adresse et répond 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8000;

  client_max_body_size 21m;

  # API relayée vers le service `api` ; tampons désactivés pour les Server-Sent Events.
  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /docs {
    proxy_pass $api;
  }

  location /assets/ {
    include /etc/nginx/securite.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Application monopage : toute autre route renvoie index.html.
  location / {
    include /etc/nginx/securite.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
